[panel.example]
url = https://127.0.0.1:8888
api_key = replace-with-baota-api-key
verify_ssl = false
timeout = 15
# Default CA for new certificates when --ca is not provided.
# Built-ins: letsencrypt, letsencrypt-staging, litessl, buypass, buypass-staging, zerossl, google, sslcom
default_ca = letsencrypt
# Optional fallback CAs used only when the active CA returns a rate-limit/quota error.
ca_fallbacks = buypass

# Optional custom ACME directory. When set, it overrides the built-in directory for this panel.
# acme_directory_url = https://acme.example.com/directory

# Required by some ACME providers such as ZeroSSL, Google Trust Services, and SSL.com.
# acme_eab_kid =
# acme_eab_hmac_key =

# Add more panels by adding more [panel.*] sections:
#
# [panel.production]
# url = https://panel.example.com:8888
# api_key = another-api-key
# verify_ssl = true
# default_ca = buypass
# ca_fallbacks = letsencrypt, zerossl
