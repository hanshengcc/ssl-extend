[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baota-ssl-renewer"
version = "0.1.0"
description = "Terminal SSL renewer for multiple BT/Baota panels."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "respx>=0.21.0",
]

[project.scripts]
baota-ssl-renewer = "baota_ssl_renewer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/baota_ssl_renewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
